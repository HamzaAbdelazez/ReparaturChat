version: '3.8'

services:
  # PostgreSQL Database with pgvector
  database:
    image: pgvector/pgvector:pg15
    container_name: reparatur_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reparatur
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/api/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - reparatur_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d reparatur"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reparatur_backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reparatur
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      # API Keys from .env file
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - reparatur_network

  # Frontend 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reparatur_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - reparatur_network

volumes:
  postgres_data:

networks:
  reparatur_network:
    driver: bridge